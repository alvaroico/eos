apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: eos
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path   # Provisioner nativo do k3s
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: eos
spec:
  replicas: 1
  strategy:
    type: Recreate   # Obrigatório com PVC RWO para evitar conflitos de mounts
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: eos
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: eos-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eos-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: eos
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
