apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eos
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/alvaroico/eos.git'
    targetRevision: alvaroico
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: eos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
